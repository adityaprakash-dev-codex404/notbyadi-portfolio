    <line x1="10" y1="64" x2="118" y2="64"/>
    <path d="M 17 40 Q 64 50 111 40"/>
    <path d="M 17 88 Q 64 78 111 88"/>
  </g>
  <!-- Pixelated ADI Text -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <!-- Letter A -->
    <rect x="22" y="48" width="8" height="32" fill="#fff"/>
    <rect x="38" y="48" width="8" height="32" fill="#fff"/>
    <rect x="30" y="48" width="8" height="8" fill="#fff"/>
    <rect x="30" y="64" width="8" height="8" fill="#fff"/>
    
    <!-- Letter D -->
    <rect x="52" y="48" width="8" height="32" fill="#fff"/>
    <rect x="60" y="48" width="10" height="8" fill="#fff"/>
    <rect x="60" y="72" width="10" height="8" fill="#fff"/>
    <rect x="70" y="56" width="6" height="16" fill="#fff"/>
    
    <!-- Letter I -->
    <rect x="84" y="48" width="22" height="8" fill="#fff"/>
    <rect x="91" y="56" width="8" height="16" fill="#fff"/>
    <rect x="84" y="72" width="22" height="8" fill="#fff"/>
